<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events | Karnataka Bird Monitoring Network</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div class="container">
      <h1>Events</h1>
      <p>Join bird counts, nature walks, workshops, surveys, and conservation activities across Karnataka.</p>

      <div class="event-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="future">Upcoming</button>
        <button class="filter-btn" data-filter="past">Past</button>
      </div>

      <div id="events-container" class="event-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
