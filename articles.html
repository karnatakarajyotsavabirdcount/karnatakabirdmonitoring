<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles | Karnataka Bird Monitoring Network</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div class="container">
      <h1>Articles</h1>
      <p>Field notes, birding experiences, monitoring updates, species stories, and conservation reflections from across Karnataka.</p>

      <div class="article-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Field Notes">Field Notes</button>
        <button class="filter-btn" data-filter="Citizen Science">Citizen Science</button>
        <button class="filter-btn" data-filter="Species Spotlight">Species Spotlight</button>
        <button class="filter-btn" data-filter="Conservation">Conservation</button>
      </div>

      <div id="articles-container" class="article-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/articles.js"></script>
</body>
</html>
